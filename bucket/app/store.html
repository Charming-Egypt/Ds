<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>LUXE Dining Experience</title>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&family=Inter:wght@300;400;500;600;700;800;900&family=Syncopate:wght@400;700&display=swap');

        :root {
            --bg: #000000;
            --gold: #c8a45c;
            --gold-glow: rgba(200,164,92,0.3);
            --white: #ffffff;
            --text-dim: rgba(255,255,255,0.5);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', 'Cairo', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh; height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            cursor: none;
        }
        body.ar { font-family: 'Cairo', sans-serif; direction: rtl; }

        /* ===== Custom Cursor ===== */
        .custom-cursor {
            position: fixed;
            width: 20px; height: 20px;
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.15s ease, width 0.3s, height 0.3s, border-color 0.3s;
            mix-blend-mode: difference;
        }
        .custom-cursor-dot {
            position: fixed;
            width: 4px; height: 4px;
            background: var(--gold);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.08s ease;
        }
        @media (max-width: 768px) {
            .custom-cursor, .custom-cursor-dot { display: none; }
            body { cursor: auto; }
        }

        /* ===== Main Container ===== */
        .app-container {
            height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ===== Ambient Background ===== */
        .ambient-bg {
            position: fixed; inset: 0; z-index: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(200,164,92,0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(200,164,92,0.04) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.02) 0%, transparent 70%);
        }
        .ambient-particles {
            position: fixed; inset: 0; z-index: 0; overflow: hidden;
        }
        .ambient-particle {
            position: absolute;
            width: 1px; height: 1px;
            background: var(--gold);
            border-radius: 50%;
            animation: ambientFloat 8s ease-in-out infinite;
        }
        @keyframes ambientFloat {
            0%,100% { transform: translate(0,0) scale(1); opacity: 0; }
            25% { opacity: 0.6; }
            50% { transform: translate(40px,-60px) scale(2); opacity: 0; }
            75% { opacity: 0.3; }
        }

        /* ===== Top Bar ===== */
        .top-bar {
            position: relative; z-index: 10;
            padding: calc(var(--safe-top) + 0.5rem) 1.5rem 0.5rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo-text {
            font-family: 'Syncopate', sans-serif;
            font-size: 0.7rem; font-weight: 700;
            letter-spacing: 6px; color: var(--gold);
            text-transform: uppercase;
        }
        .top-actions {
            display: flex; gap: 1rem; align-items: center;
        }
        .top-btn {
            background: none; border: none; color: #fff;
            font-size: 1.2rem; cursor: pointer; padding: 0.4rem;
            transition: all 0.3s; opacity: 0.7;
            position: relative;
        }
        .top-btn:hover { opacity: 1; transform: scale(1.1); }
        .cart-indicator {
            position: absolute; top: 0; right: 0;
            width: 7px; height: 7px; background: var(--gold);
            border-radius: 50%; display: none;
        }
        .cart-indicator.show { display: block; }

        /* ===== Main 3D Stage ===== */
        .stage-container {
            flex: 1; position: relative; z-index: 5;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px;
        }
        .stage-scene {
            width: 100%; height: 100%;
            display: flex; align-items: center;
            position: relative;
        }

        /* ===== Category Indicator ===== */
        .category-marker {
            position: absolute; top: 2rem; left: 50%; transform: translateX(-50%);
            z-index: 8; display: flex; gap: 0.5rem;
        }
        .category-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .category-dot.active {
            background: var(--gold);
            width: 20px; border-radius: 3px;
            box-shadow: 0 0 10px var(--gold-glow);
        }

        /* ===== 3D Product Carousel ===== */
        .product-carousel {
            display: flex; gap: 1.5rem;
            padding: 0 calc(50vw - 140px);
            overflow-x: auto; overflow-y: hidden;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            align-items: center;
            height: 100%;
            cursor: grab;
        }
        .product-carousel::-webkit-scrollbar { display: none; }
        .product-carousel:active { cursor: grabbing; }

        /* ===== 3D Card ===== */
        .product-card-3d {
            flex-shrink: 0; scroll-snap-align: center;
            width: 280px; height: 420px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }
        .product-card-3d:hover {
            transform: translateZ(30px) rotateY(-5deg);
        }
        .product-card-3d:active {
            transform: translateZ(10px) scale(0.95);
        }

        /* ===== Card Inner Layers ===== */
        .card-inner {
            width: 100%; height: 100%;
            position: relative;
            transform-style: preserve-3d;
            border-radius: 24px;
            overflow: hidden;
        }

        /* ===== Card Glow ===== */
        .card-glow {
            position: absolute; inset: -2px;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--gold), transparent 40%, transparent 60%, var(--gold));
            opacity: 0;
            transition: opacity 0.4s;
            z-index: -1;
            filter: blur(15px);
        }
        .product-card-3d:hover .card-glow { opacity: 0.6; }

        /* ===== Card Face ===== */
        .card-face {
            width: 100%; height: 100%;
            border-radius: 24px;
            background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column;
            position: relative; overflow: hidden;
            transform-style: preserve-3d;
        }

        /* ===== Card Emoji Stage ===== */
        .card-emoji-stage {
            flex: 1; display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            background: radial-gradient(circle at center, rgba(200,164,92,0.1) 0%, transparent 70%);
        }
        .card-emoji {
            font-size: 8rem;
            transform-style: preserve-3d;
            animation: emojiHover 4s ease-in-out infinite;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5));
        }
        @keyframes emojiHover {
            0%,100% { transform: translateZ(20px) translateY(0); }
            50% { transform: translateZ(40px) translateY(-10px); }
        }
        .card-emoji-reflection {
            position: absolute; bottom: -30px;
            font-size: 6rem; opacity: 0.15;
            transform: scaleY(-1) translateZ(-10px);
            filter: blur(8px);
            pointer-events: none;
        }

        /* ===== Card Info ===== */
        .card-info {
            padding: 1.5rem; position: relative; z-index: 2;
            background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
        }
        .card-category {
            font-size: 0.6rem; text-transform: uppercase;
            letter-spacing: 4px; color: var(--gold);
            margin-bottom: 0.3rem; font-weight: 700;
        }
        .card-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem; font-weight: 900;
            margin-bottom: 0.3rem; line-height: 1.1;
        }
        .card-desc {
            font-size: 0.75rem; color: var(--text-dim);
            margin-bottom: 1rem; display: -webkit-box;
            -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-bottom {
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-price {
            font-size: 1.8rem; font-weight: 900; color: var(--gold);
            text-shadow: 0 0 20px var(--gold-glow);
        }
        .card-price .currency { font-size: 0.8rem; opacity: 0.7; }
        .card-add-btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: var(--gold); border: none; color: #000;
            font-size: 1.5rem; cursor: pointer; font-weight: 700;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 30px var(--gold-glow);
            display: flex; align-items: center; justify-content: center;
        }
        .card-add-btn:hover { transform: scale(1.1); box-shadow: 0 12px 40px rgba(200,164,92,0.5); }
        .card-add-btn:active { transform: scale(0.85); }

        /* ===== Bottom Navigation ===== */
        .bottom-nav {
            position: relative; z-index: 10;
            padding: 1rem 1.5rem; padding-bottom: calc(1rem + var(--safe-bottom));
            display: flex; justify-content: center; gap: 2rem;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
            background: none; border: none; color: var(--text-dim);
            cursor: pointer; font-family: inherit; font-size: 0.65rem;
            transition: all 0.3s; padding: 0.3rem;
        }
        .nav-item.active { color: var(--gold); }
        .nav-item-icon { font-size: 1.4rem; position: relative; }
        .nav-item-count {
            position: absolute; top: -6px; right: -10px;
            background: var(--gold); color: #000;
            width: 16px; height: 16px; border-radius: 50%;
            font-size: 0.55rem; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            display: none;
        }
        .nav-item-count.show { display: flex; }

        /* ===== Detail Modal - Fullscreen ===== */
        .detail-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(30px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .detail-overlay.show { opacity: 1; pointer-events: auto; }
        .detail-card {
            text-align: center; padding: 2rem; max-width: 350px;
            animation: detailIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes detailIn {
            from { opacity: 0; transform: scale(0.7) translateY(40px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .detail-emoji { font-size: 8rem; margin-bottom: 1rem; filter: drop-shadow(0 20px 40px rgba(200,164,92,0.3)); }
        .detail-name { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; margin-bottom: 0.5rem; }
        .detail-desc { color: var(--text-dim); margin-bottom: 1.5rem; font-size: 0.9rem; line-height: 1.6; }
        .detail-price { font-size: 2.5rem; font-weight: 900; color: var(--gold); margin-bottom: 2rem; }
        .detail-add-btn {
            padding: 1rem 3rem; background: var(--gold); border: none;
            border-radius: 50px; color: #000; font-size: 1rem; font-weight: 800;
            cursor: pointer; font-family: inherit; transition: all 0.3s;
            box-shadow: 0 10px 40px var(--gold-glow);
        }
        .detail-add-btn:active { transform: scale(0.9); }
        .detail-close {
            position: absolute; top: 2rem; right: 2rem;
            background: none; border: none; color: #fff;
            font-size: 2rem; cursor: pointer; opacity: 0.6;
            transition: all 0.3s;
        }
        .detail-close:hover { opacity: 1; transform: rotate(90deg); }

        /* ===== Toast ===== */
        .toast-popup {
            position: fixed; top: calc(var(--safe-top) + 3rem);
            left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--gold); color: #000;
            padding: 0.6rem 1.5rem; border-radius: 50px;
            font-weight: 700; font-size: 0.8rem;
            z-index: 200; opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .toast-popup.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }

        /* ===== Responsive ===== */
        @media (max-width: 360px) {
            .product-card-3d { width: 240px; height: 360px; }
            .product-carousel { padding: 0 calc(50vw - 120px); }
            .card-emoji { font-size: 6rem; }
            .card-name { font-size: 1.3rem; }
            .card-price { font-size: 1.5rem; }
        }
    </style>
</head>
<body class="en">
    <!-- Custom Cursor -->
    <div class="custom-cursor" id="customCursor"></div>
    <div class="custom-cursor-dot" id="customCursorDot"></div>

    <!-- Ambient -->
    <div class="ambient-bg"></div>
    <div class="ambient-particles" id="ambientParticles"></div>

    <!-- App -->
    <div class="app-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="logo-text">Luxe</div>
            <div class="top-actions">
                <button class="top-btn" onclick="switchLanguage()">🌐</button>
                <button class="top-btn" onclick="toggleCart()">
                    🛒
                    <span class="cart-indicator" id="cartIndicator"></span>
                </button>
            </div>
        </div>

        <!-- Category Dots -->
        <div class="category-marker" id="categoryMarker"></div>

        <!-- 3D Stage -->
        <div class="stage-container">
            <div class="stage-scene">
                <div class="product-carousel" id="productCarousel"></div>
            </div>
        </div>

        <!-- Bottom Nav -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchCategory('all')">
                <span class="nav-item-icon">🌟</span> All
            </button>
            <button class="nav-item" onclick="switchCategory('coffee')">
                <span class="nav-item-icon">☕</span> Coffee
            </button>
            <button class="nav-item" onclick="switchCategory('main')">
                <span class="nav-item-icon">🥩</span> Mains
            </button>
            <button class="nav-item" onclick="switchCategory('dessert')">
                <span class="nav-item-icon">🍰</span> Dessert
            </button>
            <button class="nav-item" id="cartNavItem" onclick="toggleCart()">
                <span class="nav-item-icon">
                    🛒
                    <span class="nav-item-count" id="cartNavCount">0</span>
                </span> Cart
            </button>
        </div>
    </div>

    <!-- Detail Overlay -->
    <div class="detail-overlay" id="detailOverlay">
        <button class="detail-close" onclick="closeDetail()">✕</button>
        <div class="detail-card">
            <div class="detail-emoji" id="detailEmoji"></div>
            <div class="detail-name" id="detailName"></div>
            <div class="detail-desc" id="detailDesc"></div>
            <div class="detail-price" id="detailPrice"></div>
            <button class="detail-add-btn" id="detailAddBtn">Add to Order</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-popup" id="toastPopup"></div>

    <script>
    (function() {
        // ===== Products Data =====
        var products = [
            { id:1, name:"Double Espresso", emoji:"☕", cat:"coffee", price:45, desc:"Rich, concentrated coffee shot with golden crema. The essence of pure coffee." },
            { id:2, name:"Cappuccino Royale", emoji:"☕", cat:"coffee", price:65, desc:"Velvet steamed milk over bold espresso. Crowned with delicate foam art." },
            { id:3, name:"Iced Caramel Latte", emoji:"🥤", cat:"coffee", price:75, desc:"Cold-brewed perfection with silky caramel. Refreshingly indulgent." },
            { id:4, name:"Wagyu Ribeye", emoji:"🥩", cat:"main", price:450, desc:"A5 Japanese Wagyu, perfectly marbled. Grilled to your desire." },
            { id:5, name:"Truffle Pasta", emoji:"🍝", cat:"main", price:280, desc:"Hand-made fettuccine with black truffle. Decadent cream sauce." },
            { id:6, name:"Grilled Salmon", emoji:"🐟", cat:"main", price:380, desc:"Atlantic salmon with herbs. Served with seasonal vegetables." },
            { id:7, name:"Tiramisu Classico", emoji:"🍰", cat:"dessert", price:110, desc:"Layers of mascarpone and espresso-soaked savoiardi. Italian classic." },
            { id:8, name:"Molten Lava Cake", emoji:"🍫", cat:"dessert", price:130, desc:"Warm chocolate fondant with liquid center. Vanilla ice cream." },
            { id:9, name:"Crème Brûlée", emoji:"🍮", cat:"dessert", price:95, desc:"French vanilla custard with caramelized sugar crust. Silky smooth." },
        ];

        var cart = [];
        var currentCategory = 'all';
        var currentDetailId = null;

        // ===== DOM =====
        var productCarousel = document.getElementById('productCarousel');
        var categoryMarker = document.getElementById('categoryMarker');
        var detailOverlay = document.getElementById('detailOverlay');
        var toastPopup = document.getElementById('toastPopup');
        var cartIndicator = document.getElementById('cartIndicator');
        var cartNavCount = document.getElementById('cartNavCount');

        // ===== Render 3D Carousel =====
        function renderCarousel() {
            var filtered = currentCategory === 'all' ? products : products.filter(function(p) { return p.cat === currentCategory; });
            
            productCarousel.innerHTML = filtered.map(function(p, i) {
                return `
                    <div class="product-card-3d" data-id="${p.id}" style="animation: cardEnter 0.6s ease ${i*0.1}s backwards;">
                        <div class="card-glow"></div>
                        <div class="card-inner">
                            <div class="card-face">
                                <div class="card-emoji-stage">
                                    <span class="card-emoji">${p.emoji}</span>
                                </div>
                                <div class="card-info">
                                    <div class="card-category">${p.cat}</div>
                                    <div class="card-name">${p.name}</div>
                                    <div class="card-desc">${p.desc}</div>
                                    <div class="card-bottom">
                                        <div class="card-price">${p.price} <span class="currency">EGP</span></div>
                                        <button class="card-add-btn" data-id="${p.id}">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Event listeners
            productCarousel.querySelectorAll('.product-card-3d').forEach(function(card) {
                card.addEventListener('click', function(e) {
                    if (e.target.closest('.card-add-btn')) return;
                    openDetail(parseInt(this.dataset.id));
                });
            });

            productCarousel.querySelectorAll('.card-add-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    addToCart(parseInt(this.dataset.id));
                });
            });

            // Scroll snap listener
            updateCategoryDots();
            productCarousel.addEventListener('scroll', updateCategoryDots);
        }

        function updateCategoryDots() {
            var cards = productCarousel.querySelectorAll('.product-card-3d');
            if (!cards.length) return;
            
            var carouselCenter = productCarousel.scrollLeft + productCarousel.offsetWidth / 2;
            var activeIndex = 0;
            var minDistance = Infinity;
            
            cards.forEach(function(card, i) {
                var cardCenter = card.offsetLeft + card.offsetWidth / 2;
                var distance = Math.abs(carouselCenter - cardCenter);
                if (distance < minDistance) {
                    minDistance = distance;
                    activeIndex = i;
                }
            });

            categoryMarker.innerHTML = cards.map(function(_, i) {
                return '<div class="category-dot' + (i === activeIndex ? ' active' : '') + '"></div>';
            }).join('');
        }

        // ===== Detail Modal =====
        function openDetail(id) {
            var p = products.find(function(x) { return x.id === id; });
            if (!p) return;
            currentDetailId = id;
            document.getElementById('detailEmoji').textContent = p.emoji;
            document.getElementById('detailName').textContent = p.name;
            document.getElementById('detailDesc').textContent = p.desc;
            document.getElementById('detailPrice').textContent = p.price + ' EGP';
            document.getElementById('detailAddBtn').textContent = 'Add to Order • ' + p.price + ' EGP';
            document.getElementById('detailAddBtn').onclick = function() { addToCart(id); closeDetail(); };
            detailOverlay.classList.add('show');
        }

        function closeDetail() {
            detailOverlay.classList.remove('show');
            currentDetailId = null;
        }

        // ===== Cart =====
        function addToCart(id) {
            var existing = cart.find(function(i) { return i.id === id; });
            if (existing) { existing.qty++; }
            else { cart.push({ id: id, qty: 1 }); }
            updateCartUI();
            showToast('Added to order ✨');
        }

        function updateCartUI() {
            var count = cart.reduce(function(s, i) { return s + i.qty; }, 0);
            cartIndicator.classList.toggle('show', count > 0);
            cartNavCount.textContent = count;
            cartNavCount.parentElement.classList.toggle('show', count > 0);
        }

        function toggleCart() {
            if (cart.length === 0) { showToast('Your cart is empty'); return; }
            var items = cart.map(function(i) {
                var p = products.find(function(x) { return x.id === i.id; });
                return p ? p.emoji + ' ' + p.name + ' x' + i.qty : '';
            }).filter(Boolean).join('\n');
            var total = cart.reduce(function(s, i) {
                var p = products.find(function(x) { return x.id === i.id; });
                return s + (p ? p.price * i.qty : 0);
            }, 0);
            alert('🛒 Your Order\n\n' + items + '\n\nTotal: ' + total + ' EGP\n\n✅ Order placed successfully!');
            cart = [];
            updateCartUI();
        }

        // ===== Category Switch =====
        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.bottom-nav .nav-item').forEach(function(item, i) {
                item.classList.toggle('active', i === ['all','coffee','main','dessert','cart'].indexOf(cat));
            });
            renderCarousel();
            productCarousel.scrollLeft = 0;
        }

        // ===== Language =====
        function switchLanguage() {
            var langs = ['en', 'ar', 'ru', 'it', 'de'];
            var current = document.body.classList.contains('ar') ? 'ar' : 'en';
            var next = langs[(langs.indexOf(current) + 1) % langs.length];
            document.body.className = next;
            document.documentElement.lang = next;
            document.documentElement.dir = next === 'ar' ? 'rtl' : 'ltr';
            showToast('Language: ' + next.toUpperCase());
        }

        // ===== Toast =====
        function showToast(msg) {
            toastPopup.textContent = msg;
            toastPopup.classList.add('show');
            clearTimeout(toastPopup._t);
            toastPopup._t = setTimeout(function() { toastPopup.classList.remove('show'); }, 2000);
        }

        // ===== Custom Cursor =====
        var cursor = document.getElementById('customCursor');
        var cursorDot = document.getElementById('customCursorDot');
        document.addEventListener('mousemove', function(e) {
            if (cursor) { cursor.style.left = e.clientX - 10 + 'px'; cursor.style.top = e.clientY - 10 + 'px'; }
            if (cursorDot) { cursorDot.style.left = e.clientX - 2 + 'px'; cursorDot.style.top = e.clientY - 2 + 'px'; }
        });
        document.addEventListener('mousedown', function() {
            if (cursor) cursor.style.transform = 'scale(0.7)';
        });
        document.addEventListener('mouseup', function() {
            if (cursor) cursor.style.transform = 'scale(1)';
        });

        // ===== Ambient Particles =====
        function createParticles() {
            var container = document.getElementById('ambientParticles');
            for (var i = 0; i < 30; i++) {
                var particle = document.createElement('div');
                particle.className = 'ambient-particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (6 + Math.random() * 10) + 's';
                container.appendChild(particle);
            }
        }

        // ===== Init =====
        function init() {
            createParticles();
            renderCarousel();
            updateCartUI();

            // Keyboard navigation
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeDetail();
                if (e.key === 'ArrowRight') productCarousel.scrollLeft += 300;
                if (e.key === 'ArrowLeft') productCarousel.scrollLeft -= 300;
            });

            // Touch scroll for carousel
            var isDown = false, startX, scrollLeftPos;
            productCarousel.addEventListener('mousedown', function(e) {
                isDown = true; startX = e.pageX - productCarousel.offsetLeft;
                scrollLeftPos = productCarousel.scrollLeft;
            });
            productCarousel.addEventListener('mouseleave', function() { isDown = false; });
            productCarousel.addEventListener('mouseup', function() { isDown = false; });
            productCarousel.addEventListener('mousemove', function(e) {
                if (!isDown) return;
                e.preventDefault();
                var x = e.pageX - productCarousel.offsetLeft;
                var walk = (x - startX) * 2;
                productCarousel.scrollLeft = scrollLeftPos - walk;
            });
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    })();
    </script>

    <style>
        @keyframes cardEnter {
            from { opacity: 0; transform: translateZ(-100px) scale(0.8) rotateY(20deg); }
            to { opacity: 1; transform: translateZ(0) scale(1) rotateY(0); }
        }
    </style>
</body>
</html>
