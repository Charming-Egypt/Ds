<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <title>QR Menu — Premium Experience</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface2: #1c1c1e;
            --surface3: #2c2c2e;
            --gold: #c8a45c;
            --gold-light: #e2c97e;
            --gold-dark: #9b7530;
            --gold-gradient: linear-gradient(135deg, #c8a45c 0%, #e2c97e 30%, #9b7530 70%, #c8a45c 100%);
            --text: #ffffff;
            --text-secondary: #a3a3a3;
            --text-muted: #636366;
            --border: rgba(255, 255, 255, 0.08);
            --red: #ff3b30;
            --green: #34c759;
            --orange: #fb923c;
            --blue: #60a5fa;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
            --safe-top: env(safe-area-inset-top, 0px);
            --radius-sm: 14px;
            --radius: 20px;
            --radius-lg: 28px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', 'Cairo', sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        body.ar { font-family: 'Cairo', 'Inter', sans-serif; direction: rtl; }
        body.en, body.ru, body.it, body.de { font-family: 'Inter', sans-serif; direction: ltr; }

        /* Splash Screen */
        .splash-screen {
            position: fixed; inset: 0; background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 100%);
            z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity .8s, visibility .8s; padding: 2rem; overflow: hidden;
        }
        .splash-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .splash-particles { position: absolute; inset: 0; pointer-events: none; }
        .splash-particle { position: absolute; width: 3px; height: 3px; background: var(--gold); border-radius: 50%; animation: particleFloat 4s ease-in-out infinite; }
        @keyframes particleFloat { 0%,100% { transform: translateY(0); opacity: .3; } 50% { transform: translateY(-30px); opacity: .8; } }
        .splash-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem; position: relative; z-index: 2; }
        .splash-logo-wrapper { position: relative; margin-bottom: .5rem; }
        .splash-glow { position: absolute; inset: -40px; background: radial-gradient(circle, rgba(200,164,92,.15) 0%, transparent 70%); border-radius: 50%; animation: glowPulse 2s ease-in-out infinite; }
        @keyframes glowPulse { 0%,100% { transform: scale(1); opacity: .5; } 50% { transform: scale(1.2); opacity: 1; } }
        .splash-rings { position: absolute; inset: -25px; border: 1px solid rgba(200,164,92,.3); border-radius: 50%; animation: ringExpand 2.5s ease-out infinite; }
        .splash-rings:nth-child(2) { inset: -40px; animation-delay: .5s; border-color: rgba(200,164,92,.15); }
        .splash-rings:nth-child(3) { inset: -55px; animation-delay: 1s; border-color: rgba(200,164,92,.08); }
        @keyframes ringExpand { 0% { transform: scale(.8); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
        .splash-logo {
            width: 130px; height: 130px; border-radius: 35px; background: var(--gold-gradient);
            display: flex; align-items: center; justify-content: center; font-size: 4rem; overflow: hidden;
            box-shadow: 0 20px 60px rgba(200,164,92,.4);
            animation: logoEntrance 1.2s cubic-bezier(.175,.885,.32,1.275), logoFloat 4s ease-in-out 1.2s infinite; position: relative; z-index: 1;
        }
        @keyframes logoEntrance { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 60% { transform: scale(1.15) rotate(5deg); opacity: 1; } 80% { transform: scale(.95) rotate(-2deg); } 100% { transform: scale(1) rotate(0); opacity: 1; } }
        @keyframes logoFloat { 0%,100% { transform: translateY(0); } 25% { transform: translateY(-10px); } 75% { transform: translateY(5px); } }
        .splash-logo img { width: 100%; height: 100%; object-fit: cover; }
        .splash-name { font-family: 'Playfair Display', serif !important; font-size: 2.5rem !important; font-weight: 900 !important; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; text-align: center; animation: nameReveal 1.5s cubic-bezier(.175,.885,.32,1.275) .4s both; line-height: 1.2; }
        @keyframes nameReveal { 0% { transform: translateY(40px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .splash-loader { width: 200px; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; margin-top: 1rem; animation: loaderFadeIn .5s ease .8s both; }
        @keyframes loaderFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
        .splash-loader::after { content:''; display:block; width:50%; height:100%; background: var(--gold-gradient); border-radius:2px; animation:loadSlide 1.5s ease-in-out infinite; }
        @keyframes loadSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
        .splash-footer { padding: 2rem; text-align: center; display: flex; flex-direction: column; gap: .4rem; animation: nameReveal 1s ease 1s both; position: relative; z-index: 2; }
        .splash-footer span { font-size: .65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }
        .splash-footer a { font-size: 1rem; font-weight: 700; color: var(--gold); text-decoration: none; letter-spacing: .5px; }

        .loading-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 500; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .3s; }
        .loading-overlay.show { opacity: 1; pointer-events: auto; }
        .loading-spinner { width: 45px; height: 45px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== MOBILE STYLES ========== */
        .page-wrapper { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; background: var(--bg); }
        .screen { display: none; } .screen.active { display: block; }
        .hero-wrapper { position: relative; width: 100%; min-height: 50vh; overflow: hidden; background: var(--surface2); }
        .hero-bg { width: 100%; height: 100%; background-size: cover; background-position: center; position: absolute; inset: 0; }
        .hero-bg::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom, rgba(10,10,10,.2), rgba(10,10,10,.5) 70%, var(--bg) 95%); }
        .hero-top-bar { position:absolute; top:var(--safe-top); left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:1rem 1.2rem; z-index:10; gap:.5rem; }
        .hero-left-btns { display:flex; align-items:center; gap:.5rem; }
        .hero-lang-wrapper { position:relative; }
        .hero-lang-btn { padding:.45rem .8rem; border-radius:50px; font-size:.75rem; font-weight:700; background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.2); color:#fff; cursor:pointer; display:flex; align-items:center; gap:.3rem; }
        .hero-lang-drop { position:absolute; top:calc(100% + 8px); left:0; background:var(--surface3); border:1px solid var(--border); border-radius:var(--radius-sm); min-width:150px; display:none; z-index:60; box-shadow:0 10px 30px rgba(0,0,0,.5); overflow:hidden; }
        body.ar .hero-lang-drop { left:auto; right:0; }
        .hero-lang-drop.open { display:block; }
        .hero-lang-opt { padding:.8rem 1rem; cursor:pointer; font-size:.8rem; color:var(--text-secondary); transition:all .2s; display:flex; align-items:center; gap:.4rem; }
        .hero-lang-opt:hover { background:rgba(200,164,92,.1); color:var(--text); }
        .hero-lang-opt.active { color:var(--gold); font-weight:700; }
        .customer-btn { width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .customer-info { display:flex; align-items:center; gap:.4rem; background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.2); border-radius:50px; padding:.3rem .6rem .3rem .3rem; cursor:pointer; }
        .customer-avatar { width:30px; height:30px; border-radius:50%; background:var(--gold-gradient); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.75rem; color:#000; }
        .customer-name { font-size:.68rem; font-weight:600; color:#fff; max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .hero-cart-btn { width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:1.1rem; cursor:pointer; position:relative; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .hero-cart-badge { position:absolute; top:-3px; right:-3px; min-width:20px; height:20px; background:var(--red); color:#fff; border-radius:50%; font-size:.65rem; font-weight:800; display:none; align-items:center; justify-content:center; }
        .hero-cart-badge.show { display:flex; }
        .hero-content { position:relative; padding:38vh 1.5rem 1.5rem; z-index:2; text-align:center; }
        .hero-logo { width:60px; height:60px; border-radius:16px; margin:0 auto .5rem; overflow:hidden; background:var(--gold-gradient); display:flex; align-items:center; justify-content:center; font-size:1.5rem; }
        .hero-logo img { width:100%; height:100%; object-fit:cover; }
        .hero-title { font-family:'Playfair Display',serif; font-size:1.6rem; font-weight:900; color:#fff; text-shadow:0 4px 20px rgba(0,0,0,.5); margin-bottom:.1rem; }
        .hero-desc { color:rgba(255,255,255,.85); font-size:.7rem; max-width:320px; margin:0 auto; line-height:1.6; white-space:normal; }
        .hero-meta { display:flex; justify-content:center; gap:.8rem; margin-top:.3rem; font-size:.6rem; color:rgba(255,255,255,.7); flex-wrap:wrap; }
        .table-tag { display:inline-flex; align-items:center; gap:.3rem; background:rgba(0,0,0,.5); padding:.25rem .8rem; border-radius:50px; font-weight:700; font-size:.65rem; color:#fff; margin-top:.3rem; }

        .menu-content { padding:.6rem 1rem 6rem; }
        .controls-row { display:flex; gap:.5rem; margin-bottom:.5rem; align-items:center; }
        .currency-scroll { display:flex; gap:.25rem; flex:1; overflow-x:auto; scrollbar-width:none; }
        .cur-chip { padding:.3rem .6rem; background:var(--surface2); border:1px solid var(--border); border-radius:50px; color:var(--text-secondary); font-size:.65rem; font-weight:700; cursor:pointer; white-space:nowrap; }
        .cur-chip.active { background:var(--gold); color:#000; border-color:var(--gold); }
        .view-toggles { display:flex; background:var(--surface2); border-radius:50px; padding:.1rem; }
        .vt-btn { width:28px; height:28px; border-radius:50%; border:none; background:transparent; color:var(--text-muted); font-size:.7rem; cursor:pointer; }
        .vt-btn.active { background:var(--gold); color:#000; }
        .cats-strip { display:flex; gap:.35rem; overflow-x:auto; padding:.15rem 0 .5rem; scrollbar-width:none; }
        .cat-chip { flex-shrink:0; padding:.45rem .8rem; background:var(--surface2); border:1px solid var(--border); border-radius:50px; color:var(--text-secondary); font-size:.65rem; font-weight:600; cursor:pointer; white-space:nowrap; }
        .cat-chip.active { background:var(--gold); color:#000; border-color:var(--gold); }
        .section-row { display:flex; justify-content:space-between; margin:.5rem 0 .3rem; }
        .section-label { font-size:.6rem; text-transform:uppercase; letter-spacing:2px; color:var(--gold); font-weight:700; }
        .section-count { font-size:.6rem; color:var(--text-muted); }
        .prod-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.5rem; padding-bottom:1rem; }
        .prod-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:all .3s; }
        .prod-card:active { transform:scale(.96); }
        .prod-card-media { height:110px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:2.5rem; overflow:hidden; }
        .prod-card-media img { width:100%; height:100%; object-fit:cover; }
        .prod-card-body { padding:.55rem; }
        .prod-card-name { font-weight:700; font-size:.75rem; color:var(--text); margin-bottom:.08rem; }
        .prod-card-desc { font-size:.6rem; color:var(--text-muted); margin-bottom:.3rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
        .prod-card-bottom { display:flex; justify-content:space-between; align-items:center; }
        .prod-card-price { font-weight:800; font-size:.78rem; color:var(--gold-light); }
        .prod-card-add { width:28px; height:28px; border-radius:50%; background:var(--gold); border:none; color:#000; font-size:.8rem; cursor:pointer; font-weight:700; }
        .prod-list { display:flex; flex-direction:column; gap:.5rem; }
        .prod-item { display:flex; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:.5rem; gap:.6rem; }
        .prod-visual { width:60px; height:60px; border-radius:16px; background:var(--surface2); display:flex; align-items:center; justify-content:center; font-size:2rem; overflow:hidden; flex-shrink:0; }
        .prod-visual img { width:100%; height:100%; object-fit:cover; }
        .prod-details { flex:1; }
        .prod-title { font-weight:700; font-size:.8rem; }
        .prod-subtitle { font-size:.65rem; color:var(--text-muted); }
        .prod-price-tag { font-weight:800; color:var(--gold-light); font-size:.8rem; }
        .prod-add-btn { width:36px; height:36px; border-radius:50%; background:var(--gold); border:none; color:#000; font-size:1rem; cursor:pointer; }

        .page-header { display:flex; align-items:center; gap:.6rem; padding:.8rem; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
        .page-back-btn { width:32px; height:32px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .page-title-text { font-size:.85rem; font-weight:700; }
        .content-padded { padding:.8rem; padding-bottom:6rem; }

        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); backdrop-filter:blur(8px); z-index:200; display:flex; align-items:flex-end; justify-content:center; opacity:0; visibility:hidden; transition:all .4s; }
        .modal-overlay.show { opacity:1; visibility:visible; }
        .modal-sheet { background:var(--surface); border-radius:var(--radius-lg) var(--radius-lg) 0 0; width:100%; max-width:480px; max-height:85vh; overflow-y:auto; padding:1.2rem; transform:translateY(100%); transition:transform .45s; position:relative; }
        .modal-overlay.show .modal-sheet { transform:translateY(0); }
        .modal-handle { width:40px; height:5px; background:var(--text-muted); border-radius:3px; margin:0 auto .8rem; opacity:.3; }
        .modal-close-btn { position:absolute; top:.8rem; right:.8rem; width:32px; height:32px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); color:var(--text); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:10; }
        body.ar .modal-close-btn { right:auto; left:.8rem; }
        .modal-visual { width:100%; height:200px; background:var(--surface2); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; font-size:4.5rem; overflow:hidden; margin-bottom:.8rem; }
        .modal-visual img { width:100%; height:100%; object-fit:cover; }
        .modal-title { font-size:1.2rem; font-weight:800; text-align:center; margin-bottom:.3rem; }
        .modal-desc { font-size:.75rem; color:var(--text-secondary); text-align:center; margin-bottom:.6rem; line-height:1.6; }
        .modal-price { text-align:center; font-size:1.6rem; font-weight:900; color:var(--gold); margin-bottom:.8rem; }
        .modal-action { width:100%; padding:.8rem; background:var(--gold-gradient); border:none; border-radius:50px; color:#000; font-size:.8rem; font-weight:800; cursor:pointer; }
        .field { margin-bottom:.6rem; }
        .field-label { font-size:.68rem; font-weight:600; color:var(--text-secondary); display:block; margin-bottom:.15rem; }
        .field-input { width:100%; padding:.65rem .7rem; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); color:var(--text); font-family:inherit; font-size:.75rem; outline:none; }
        .field-input:focus { border-color:var(--gold); }
        .tables-3d-box { background:var(--surface); border-radius:var(--radius-lg); padding:.8rem; margin-bottom:.8rem; }
        .tables-3d-title { font-size:.7rem; font-weight:700; text-align:center; color:var(--text-secondary); margin-bottom:.4rem; }
        .tables-floor-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:.4rem; }
        .table-3d-cell { aspect-ratio:1; background:var(--surface2); border:2px solid var(--border); border-radius:var(--radius-sm); cursor:pointer; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .table-3d-cell.selected { border-color:var(--gold); background:rgba(200,164,92,.12); }
        .table-3d-cell.occupied { opacity:.25; pointer-events:none; }
        .table-num { font-size:1.1rem; font-weight:900; }
        .table-seats { font-size:.5rem; color:var(--text-muted); }
        .table-dot { position:absolute; top:5px; right:5px; width:5px; height:5px; border-radius:50%; background:var(--green); }
        .table-3d-cell.occupied .table-dot { background:var(--red); }
        .table-selected-info { text-align:center; font-size:.6rem; color:var(--text-muted); margin-top:.3rem; }
        .order-type-row { display:flex; gap:.35rem; margin-bottom:.5rem; }
        .order-type-btn { flex:1; padding:.55rem; background:var(--surface2); border:1.5px solid var(--border); border-radius:var(--radius); color:var(--text-secondary); font-weight:700; font-size:.68rem; cursor:pointer; text-align:center; }
        .order-type-btn.active { border-color:var(--gold); color:var(--gold); }
        .delivery-form-box { background:var(--surface); border-radius:var(--radius-lg); padding:.7rem; }
        .cart-items-wrap { display:flex; flex-direction:column; gap:.25rem; margin-bottom:.4rem; }
        .cart-item-row { display:flex; align-items:center; gap:.3rem; background:var(--surface); padding:.4rem .45rem; border-radius:var(--radius-sm); border:1px solid var(--border); }
        .cart-item-emoji { font-size:1.1rem; width:22px; text-align:center; }
        .cart-item-info { flex:1; min-width:0; }
        .cart-item-title { font-weight:600; font-size:.65rem; }
        .cart-item-price { font-size:.52rem; color:var(--gold-light); }
        .cart-qty-ctrl { display:flex; align-items:center; gap:.05rem; background:var(--surface2); border-radius:50px; padding:.03rem; }
        .qty-b { width:18px; height:18px; border-radius:50%; background:transparent; border:none; color:var(--text); font-size:.55rem; cursor:pointer; }
        .qty-n { width:13px; text-align:center; font-weight:700; font-size:.55rem; }
        .cart-summary-box { background:var(--surface); border-radius:var(--radius); padding:.45rem .55rem; border:1px solid var(--border); }
        .sum-row { display:flex; justify-content:space-between; font-size:.62rem; color:var(--text-secondary); margin-bottom:.1rem; }
        .sum-row.total { font-size:.8rem; font-weight:800; color:var(--text); border-top:1px solid var(--border); padding-top:.3rem; margin-top:.15rem; }
        .bottom-bar { position:fixed; bottom:0; left:0; right:0; padding:.5rem .75rem; padding-bottom:calc(.5rem + var(--safe-bottom)); background:var(--surface); border-top:1px solid var(--border); z-index:50; }
        .big-btn { width:100%; max-width:480px; margin:0 auto; display:block; padding:.75rem; background:var(--gold-gradient); border:none; border-radius:50px; color:#000; font-size:.78rem; font-weight:800; cursor:pointer; }
        .big-btn:disabled { background:var(--surface3); color:var(--text-muted); cursor:not-allowed; }
        .toast { position:fixed; bottom:85px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface3); color:var(--text); padding:.4rem .8rem; border-radius:50px; font-size:.6rem; font-weight:600; z-index:999; opacity:0; transition:all .3s; white-space:nowrap; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .confetti-box { position:fixed; inset:0; pointer-events:none; z-index:998; }
        .confetti-bit { position:absolute; border-radius:3px; animation:confettiFall 2s ease-in forwards; }
        @keyframes confettiFall { 0% { transform:translateY(-100px) rotate(0); opacity:1; } 100% { transform:translateY(105vh) rotate(700deg); opacity:0; } }
        .success-overlay { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:997; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:all .5s; }
        .success-overlay.show { opacity:1; pointer-events:auto; }
        .success-card { text-align:center; padding:2rem; }
        .success-icon { font-size:4rem; margin-bottom:.5rem; }
        .success-title { font-family:'Playfair Display',serif; font-size:1.3rem; font-weight:900; color:#fff; }
        .success-msg { color:rgba(255,255,255,.5); font-size:.7rem; }
        .success-table-info { color:var(--gold); font-size:.85rem; font-weight:700; margin-bottom:.8rem; }
        .order-id-badge { background:rgba(255,255,255,.1); padding:.3rem 1.2rem; border-radius:50px; font-weight:800; font-size:.9rem; color:var(--gold); display:inline-block; letter-spacing:2px; }
        .order-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:.7rem; margin-bottom:.5rem; }
        .order-card-header { display:flex; justify-content:space-between; margin-bottom:.4rem; }
        .order-card-id { font-weight:800; font-size:.75rem; color:var(--gold); }
        .order-card-status { font-size:.6rem; font-weight:700; padding:.15rem .5rem; border-radius:50px; }
        .order-card-status.pending { background:rgba(251,146,60,.2); color:#fb923c; }

        async function translateText(text, targetLang) {
            if (!text || targetLang === 'en') return text;
            var cacheKey = targetLang + '_' + text;
            if (translationCache[cacheKey]) return translationCache[cacheKey];
            try {
                var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=' + targetLang + '&dt=t&q=' + encodeURIComponent(text);
                var response = await fetch(url);
                var data = await response.json();
                var translated = data[0].map(function(item) { return item[0]; }).join('');
                translationCache[cacheKey] = translated;
                return translated;
            } catch(e) { return text; }
        }

        async function translateAllContent() {

            var catPromises = originalCategories.map(async function(c) { var nc = JSON.parse(JSON.stringify(c)); if (nc.name) nc.name = await translateText(nc.name, st.lang); return nc; });
            products = await Promise.all(productPromises); categories = await Promise.all(catPromises); renderProducts(); renderCats();
        }

            floor.querySelectorAll('.table-3d-cell:not(.occupied)').forEach(function(cell){cell.addEventListener('click',function(){st.selTable=+this.dataset.tid;renderTables();$('tableSelInfo').textContent='✅ '+t('tableSelected')+' #'+st.selTable;updateAllBadges()})});
        }

        function confirmOrder(){
            if(cart.length===0){showToast(t('cartEmpty'));return}
            if(!currentCustomer){showAuthModal();return}
            var orderId=Date.now();
            var customerId=currentCustomer.uid||currentCustomer.id;
            var order={id:orderId,items:cart.map(function(i){var p=products.find(function(x){return x.id===i.id});return{id:i.id,n:p?p.name:'',q:i.qty,p:p?price(p):0}}),tot:cartTotal(),st:'pending',tid:st.selTable||0,date:getTodayKey(),time:new Date().toISOString(),customerId:customerId,customerName:currentCustomer.name,customerPhone:currentCustomer.phone};
            db.ref('orders/'+order.date+'/'+orderId).set(order).catch(function(){});
            db.ref('customers/'+customerId+'/orders').once('value').then(function(snap){var ords=snap.exists()?snap.val():[];if(!Array.isArray(ords))ords=Object.values(ords);ords.push(order);db.ref('customers/'+customerId+'/orders').set(ords).catch(function(){})});
            if(st.selTable){db.ref('tables/'+st.selTable).once('value').then(function(snap){var td=snap.exists()?snap.val():{id:st.selTable,seats:2,occupied:true};if(!td.ords)td.ords=[];td.ords.push(order);td.occupied=true;db.ref('tables/'+st.selTable).update(td).catch(function(){})})}
            $('orderIdBadge').textContent='#'+Math.floor(1000+Math.random()*9000);
            $('successTableInfo').textContent=st.selTable?t('deliveringTo')+' #'+st.selTable:t('delivery');
            launchConfetti();
            $('successOverlay').classList.add('show');
            setTimeout(function(){$('successOverlay').classList.remove('show');cart=[];st.selTable=TABLE_ID||null;st.history=['menu'];st.screen='menu';document.querySelectorAll('.screen').forEach(function(sc){sc.classList.remove('active')});$('screen-menu').classList.add('active');updateAllBadges();updateCartUI();renderProducts();renderTables()},3000);
        }

        function launchConfetti(){var box=$('confettiBox');if(!box)return;var cols=['#c8a45c','#e2c97e','#ff3b30','#34c759','#ff9500','#fff'];box.innerHTML='';for(var i=0;i<50;i++){var d=document.createElement('div');d.className='confetti-bit';d.style.left=Math.random()*100+'%';d.style.animationDelay=Math.random()*1.5+'s';d.style.animationDuration=(1.5+Math.random()*2)+'s';d.style.background=cols[Math.floor(Math.random()*cols.length)];d.style.width=(5+Math.random()*5)+'px';d.style.height=(5+Math.random()*5)+'px';box.appendChild(d)}setTimeout(function(){box.innerHTML=''},2500)}

        function createParticles(){var box=$('splashParticles');if(!box)return;for(var i=0;i<30;i++){var p=document.createElement('div');p.className='splash-particle';p.style.left=Math.random()*100+'%';p.style.top=Math.random()*100+'%';p.style.animationDelay=Math.random()*3+'s';p.style.animationDuration=(3+Math.random()*3)+'s';p.style.width=(2+Math.random()*3)+'px';p.style.height=p.style.width;box.appendChild(p);}}

        createParticles();
        Promise.all([loadSplashData(),loadData()]);
        var splash=document.getElementById('splashScreen');
        if(splash){setTimeout(function(){splash.classList.add('hidden');setTimeout(function(){if(splash.parentNode)splash.remove()},800)},3500);}
        updateAllBadges();
    </script>
</body>
</html>
